server {
    listen 8088;
    listen [::]:8088;
    server_name _;
    root /var/www/lead-desk/public;
    index index.php;
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Когда появится DNS desk.lead-control.space — раскомментировать и выпустить сертификат:
