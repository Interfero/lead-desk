# lead-control.space — / (hub+desk) | /crm | /api

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lead-control.space www.lead-control.space _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name lead-control.space www.lead-control.space _;
    client_max_body_size 64M;
    add_header X-Served-By "reg-vps-194.67.92.69" always;

    ssl_certificate     /etc/letsencrypt/live/lead-control.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lead-control.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/lead-control/public;
    }

    # Статика CRM
    location ^~ /crm/build/ {
        alias /var/www/lead-control/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /crm/css/ {
        alias /var/www/lead-control/public/css/;
        expires 7d;
    }
    location ^~ /crm/js/ {
        alias /var/www/lead-control/public/js/;
        expires 7d;
    }
    location ^~ /crm/sounds/ {
        alias /var/www/lead-control/public/sounds/;
        expires 7d;
    }
    location ^~ /crm/favicon {
        alias /var/www/lead-control/public/favicon;
    }

    # CRM app (префикс /crm в Laravel routes)
    location = /crm {
        return 301 /crm/;
    }
    location ^~ /crm/ {
        try_files /dev/null @crm_php;
    }

    # API CRM без префикса
    location ^~ /api/ {
        try_files /dev/null @crm_php;
    }
    location = /up {
        try_files /dev/null @crm_php;
    }

    # Старые URL CRM → /crm/... (login остаётся у хаба!)
    location ~ ^/(orders|dashboard|cfm|persons|reports|hr|complaints|prom|settings|documents|management|information|dispatcher|city-open-times|ui-kit)(/|$) {
        return 301 /crm$request_uri;
    }

    # Хаб + Desk
    location = / {
        try_files /dev/null @desk_php;
    }
    location / {
        root /var/www/lead-desk/public;
        # без $uri/ — иначе каталог public/ даёт nginx 403
        try_files $uri @desk_php;
    }

    location @crm_php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME /var/www/lead-control/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location @desk_php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME /var/www/lead-desk/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
