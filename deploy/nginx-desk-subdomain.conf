# desk.lead-control.space — HTTP (certbot допишет SSL)
server {
    listen 80;
    listen [::]:80;
    server_name desk.lead-control.space;

    root /var/www/lead-desk/public;
    index index.php;
    client_max_body_size 32M;

    location /.well-known/acme-challenge/ {
        root /var/www/lead-desk/public;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Запасной доступ по IP:порту
